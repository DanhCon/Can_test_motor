bno055:
  ros__parameters:
    ros_topic_prefix: "bno055/"
    connection_type: "i2c"
    i2c_bus: 1                   # Jetson TX2 I2C bus (Pin 27/28 trên J21 header là bus 1; kiểm tra bằng i2cdetect)
    i2c_addr: 0x28               # Địa chỉ I2C (0x28 khi chân COM3/ADD nối GND; 0x29 khi nối 3.3V)
    data_query_frequency: 50.0   # Tần số lấy mẫu 50Hz (đồng bộ hoàn hảo với chu kỳ 20ms của STM32 UDP Gateway)
    calib_status_frequency: 0.1  # Tần số kiểm tra hiệu chuẩn (0.1Hz = 10s một lần)
    frame_id: "imu_link"
    operation_mode: 0x0C         # 0x0C = NDOF (9-DOF Sensor Fusion kết hợp Accel + Gyro + Mag)
    placement_axis: "P0"         # Hướng lắp đặt chip P0..P7 (mặc định P0: Chip nằm ngang, dot ở góc trên-trái)

    # Hệ số quy đổi đơn vị chuẩn SI cho BNO055
    acc_factor: 100.0            # 1 m/s^2 = 100 LSB
    mag_factor: 16000000.0       # 1 Tesla = 16,000,000 LSB (16 LSB / uT)
    gyr_factor: 900.0            # 1 rad/s = 900 LSB (16 LSB / deg/s)
    grav_factor: 100.0           # 1 m/s^2 = 100 LSB

    # Cấu hình nạp bù sai số (Calibration Offsets)
    # QUAN TRỌNG: Khi chuyển sang xe mới, BẮT BUỘC đặt set_offsets: false!
    # Thực hiện quy trình múa hiệu chuẩn để SYS/GYR/ACC/MAG đạt 3, sau đó gọi service
    # /bno055/calibration_request lấy các giá trị offset mới điền vào dưới và đổi thành true.
    set_offsets: false
    offset_acc: [0, 0, 0]
    offset_mag: [0, 0, 0]
    offset_gyr: [0, 0, 0]
    radius_acc: 1000
    radius_mag: 680
