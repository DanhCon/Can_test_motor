bno055_node:
  ros__parameters:
    ros_topic_prefix: "bno055/"
    connection_type: "i2c"
    i2c_bus: 1                   # Jetson TX2 Pin 27/28 (Bus 1)
    i2c_addr: 40                 # 0x28 hex = 40 dec (Integer)
    data_query_frequency: 25     # Ha tu 50Hz: bus I2C cham gay ket D-state, driver Python ton 31% CPU.
                                   # EKF chay 10Hz chi can yaw/vyaw, IMU 25Hz du dung. Offsets calib khong doi.
    calib_status_frequency: 0.1  # 0.1 Hz (Kieu DOUBLE)
    frame_id: "imu_link"
    operation_mode: 12           # 12 = 0x0C = NDOF mode (Integer)
    placement_axis_remap: "P0"

    # Scale factors chuan (Double)
    acc_factor: 100.0
    mag_factor: 16000000.0
    gyr_factor: 900.0
    grav_factor: 100.0

    # Offsets thuc te da calib (ngay 06/09/2026 tren xe moi)
    set_offsets: true
    offset_acc: [65503, 2, 65501]
    radius_acc: 1000
    offset_mag: [65341, 366, 65232]
    radius_mag: 453
    offset_gyr: [0, 65534, 65535]