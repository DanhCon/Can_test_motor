controller_server:
  ros__parameters:
    use_sim_time: false
    # High-level local control: below the 50 Hz hardware/odometry layer.
    # Ha tu 20Hz xuong 10Hz - board RK3399 khong dat noi 20Hz thuc te voi MPPI
    # (do log cho thay chi dat ~5.9-10.3Hz), gay lech model_dt va Failed to make progress.
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odometry/filtered
    enable_stamped_cmd_vel: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.09
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20

    # FALLBACK DWB (2026-09-09): thay MPPI vi libmppi apt (1.1.18) chua lenh ARMv8.1-LSE
    # (ldaddal) gay SIGILL tren TX2 (ARMv8.0). DWB nhe, khong SIMD.
    # Muon dung lai MPPI: build nav2_mppi_controller tu source tren TX2 roi khoi phuc
    # block MPPI tu git history (xem commit truoc khi thay doi nay).
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      # Khop gioi han vat ly robot (giong MPPI cu): tien 0.30, lui 0.15, xoay 0.60
      min_vel_x: -0.15
      min_vel_y: 0.0
      max_vel_x: 0.30
      max_vel_y: 0.0
      max_vel_theta: 0.60
      min_speed_xy: 0.0
      max_speed_xy: 0.30
      min_speed_theta: 0.0
      acc_lim_x: 0.60
      acc_lim_y: 0.0
      acc_lim_theta: 1.20
      decel_lim_x: -0.60
      decel_lim_y: 0.0
      decel_lim_theta: -1.20
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

      # (Block MPPI cu da xoa tai day — xem git history de khoi phuc sau khi build MPPI tu source.)

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      # Khop voi controller_frequency 10Hz - truoc day 5Hz khien mot nua chu ky
      # MPPI dung du lieu vat can cu (tre toi 200ms), giam do nhay ne vat can.
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Robot chu nhat 0.6m (dai) x 0.4m (rong), base_link o tam truc banh xe.
      # 4 diem [x, y]: truoc-trai, truoc-phai, sau-phai, sau-trai
      footprint: "[[0.30, 0.20], [0.30, -0.20], [-0.30, -0.20], [-0.30, 0.20]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan #camera_scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          # Costmap chi 4x4m (ban kinh 2m) - xu ly lidar xa hon la lang phi CPU
          obstacle_max_range: 2.5
          obstacle_min_range: 0.05
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
        # camera_scan:
        #   topic: /camera/scan
        #   data_type: "LaserScan"
        #   clearing: true
        #   marking: true
        #   obstacle_max_range: 2.0
        #   obstacle_min_range: 0.4
        #   raytrace_max_range: 2.0
        #   raytrace_min_range: 0.0
        #   max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      # false = chi gui delta qua /costmap_updates thay vi ca luoi moi lan publish
      always_send_full_costmap: false
