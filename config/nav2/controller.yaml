controller_server:
  ros__parameters:
    use_sim_time: false
    # High-level local control: below the 50 Hz hardware/odometry layer.
    # Ha tu 20Hz xuong 10Hz - board RK3399 khong dat noi 20Hz thuc te voi MPPI
    # (do log cho thay chi dat ~5.9-10.3Hz), gay lech model_dt va Failed to make progress.
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odometry/filtered
    enable_stamped_cmd_vel: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.09
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"

      # ---- Rotation Shim: xoay tai cho truoc khi giao lai cho MPPI ----
      angular_dist_threshold: 0.785        # lech > 45 do -> xoay tai cho truoc
      angular_disengage_threshold: 0.3925  # xoay den con < 22.5 do -> tra quyen cho MPPI
      forward_sampling_distance: 0.5
      # PHAI khop gioi han vat ly robot. Mac dinh Nav2 la 1.8 / 3.2 - vuot xa
      # max_vel_theta 0.60 va acc_lim_theta 1.20 cua robot nay.
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.2
      simulate_ahead_time: 1.0

      # ---- Primary controller (MPPI) ----
      time_steps: 40   # 40 x 0.1 = 4.0s ~ 1.2m tam nhin (20 buoc chi duoc 0.6m, qua ngan)
      model_dt: 0.1
      batch_size: 250   # tang tu 150 - CPU da du dia, can nhieu mau thu hon de het luong lu trai/phai
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.2  # 0.15 qua thap, cong voi CostCritic cao de bi "khoa" vao dung yen
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: false

      # Khop dung gioi han vat ly cua robot (giong DWB o tren)
      vx_max: 0.30
      vx_min: -0.15   # cho phep lui de thoat khi bi ket sat vat can (MPPI mac dinh -0.35)
      vy_max: 0.0
      wz_max: 0.60
      # std phai nho hon nhieu so voi max, neu khong mau bi cat cut o bien (clipping)
      # gay dao dong trai/phai. Ty le chuan Nav2: vx ~40%, wz ~20% cua max.
      vx_std: 0.15
      vy_std: 0.0
      wz_std: 0.2
      ax_max: 0.60
      ax_min: -0.70
      ay_max: 0.0
      ay_min: 0.0
      az_max: 1.20

      AckermannConstraints:
        min_turning_r: 0.2

      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0   # giam tu 10.0 - qua cao khien robot ngai xoay
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81  # ha ve mac dinh Nav2 - gio chi la luoi an toan cho vat can
                           # bat ngo trong 1s truoc khi global kip replan, khong con
                           # la co che ne chinh nua
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0  # global costmap da lo ne vat can -> MPPI tap trung bam duong
                           # (day la gia tri mac dinh Nav2 cho kien truc nay)
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.2
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.785398

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      # Khop voi controller_frequency 10Hz - truoc day 5Hz khien mot nua chu ky
      # MPPI dung du lieu vat can cu (tre toi 200ms), giam do nhay ne vat can.
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Robot chu nhat 0.6m (dai) x 0.4m (rong), base_link o tam truc banh xe.
      # 4 diem [x, y]: truoc-trai, truoc-phai, sau-phai, sau-trai
      footprint: "[[0.30, 0.20], [0.30, -0.20], [-0.30, -0.20], [-0.30, 0.20]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan #camera_scan
        scan:
          topic: /scan_filtered
          data_type: "LaserScan"
          clearing: true
          marking: true
          # Costmap chi 4x4m (ban kinh 2m) - xu ly lidar xa hon la lang phi CPU
          obstacle_max_range: 2.5
          obstacle_min_range: 0.05
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
        # camera_scan:
        #   topic: /camera/scan
        #   data_type: "LaserScan"
        #   clearing: true
        #   marking: true
        #   obstacle_max_range: 2.0
        #   obstacle_min_range: 0.4
        #   raytrace_max_range: 2.0
        #   raytrace_min_range: 0.0
        #   max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      # false = chi gui delta qua /costmap_updates thay vi ca luoi moi lan publish
      always_send_full_costmap: false
