amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.4
    alpha2: 0.4
    alpha3: 0.4
    alpha4: 0.4
    alpha5: 0.2
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    max_beams: 80
    max_particles: 1500             # Ha tu 3000: CPU doi (load ~14) khi full stack Nav2
    min_particles: 400              # Ha tu 800 tuong ung
    update_min_a: 0.25
    update_min_d: 0.15
    resample_interval: 1
    transform_tolerance: 1.0           # Nới từ 0.5: chịu được TF trễ khi CPU đói (EKF chậm)
    tf_broadcast: true
    set_initial_pose: true 
    # Pose mac dinh PHAI nam trong map (map phu x[0,31.78], y[-13.54,-4.06]).
    # (0,0) nam ngoai map -> spam out-of-bounds tu luc khoi dong. RViz 2D Pose van override duoc.
    initial_pose:
      x: 11.165
      y: -8.485
      z: 0.0
      yaw: 0.0
    always_reset_initial_pose: false
    save_pose_rate: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    # Use range_min/range_max reported by the LaserScan driver.
    laser_max_range: -1.0
    laser_min_range: -1.0
    z_hit: 0.7
    z_rand: 0.3
    z_short: 0.05
    z_max: 0.05
