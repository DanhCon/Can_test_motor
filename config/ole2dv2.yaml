# =============================================================================
# Cấu hình OLE Oleros2 LiDAR
# Giao thức: Ethernet UDP (libpcap)
# Kết nối: Cắm vào switch Ethernet cùng subnet với STM32 & Jetson TX2
# =============================================================================

ole2d:
  ros__parameters:
    # ============================================
    # MẠNG - CẤU HÌNH IP (Phải cùng subnet với STM32)
    # ============================================
    ip_address: "192.168.1.101"          # IP tĩnh của OLE (khác STM32 192.168.1.100)
    subnet_mask: "255.255.255.0"         # Subnet /24
    gateway: "192.168.1.1"               # Gateway (nếu cần)

ole_lidar:
  ros__parameters:
    ip_address: "192.168.1.101"
    subnet_mask: "255.255.255.0"
    gateway: "192.168.1.1"
    udp_port: 60000
    frame_id: "laser_frame"
    rpm: 10.0
    scan_frequency: 10.0
    range_min: 0.15
    range_max: 12.0
    angle_min: -3.14159265358979
    angle_max: 3.14159265358979
    scan_time: 0.1
    angle_increment: 0.00872665
    enable_intensity: true
    enable_filtering: true
    filter_min_range: 0.15
    filter_max_range: 12.0
    timestamp_type: 0
    model_name: "OLE Oleros2"
    serial_number: "00000000"
    firmware_version: "V1.00"
    
    # ============================================
    # GIAO THỨC - CẤU HÌNH CƠ BẢN
    # ============================================
    udp_port: 60000                      # Cổng UDP nhận dữ liệu từ OLE
    frame_id: "laser_frame"              # Frame ID cho TF
    
    # ============================================
    # THÔNG SỐ QUÉT
    # ============================================
    rpm: 10.0                            # Tốc độ quay (Hz)
    scan_frequency: 10.0                 # Tần số scan (Hz)
    
    # ============================================
    # PHẠM VI CỰC - LỌC DỮ LIỆU
    # ============================================
    range_min: 0.15                      # Khoảng cách tối thiểu (m)
    range_max: 12.0                      # Khoảng cách tối đa (m)
    angle_min: -3.14159265358979         # Góc bắt đầu (-π rad = 180°)
    angle_max: 3.14159265358979          # Góc kết thúc (+π rad = 180°)
    
    # ============================================
    # THỜI GIAN & ĐỘ PHÂN GIẢI
    # ============================================
    scan_time: 0.1                       # Thời gian quét 1 vòng (s) = 1/scan_frequency
    angle_increment: 0.00872665          # Rad/point (360° / 36000 điểm ≈ 0.01°)
    
    # ============================================
    # INTENSITY (nếu có)
    # ============================================
    enable_intensity: true               # Bật cường độ phản xạ
    
    # ============================================
    # LỌC BỘ LỌC (nếu driver hỗ trợ)
    # ============================================
    enable_filtering: true
    filter_min_range: 0.15
    filter_max_range: 12.0
    
    # ============================================
    # ĐỘ TRỘCH THỜI GIAN
    # ============================================
    timestamp_type: 0                    # 0 = SYSTEM_TIME, 1 = PACKET_TIME, 2 = HOST_TIME
    
    # ============================================
    # THÔNG TIN MÔ TẢ
    # ============================================
    model_name: "OLE Oleros2"
    serial_number: "00000000"            # Điền số serial thực tế
    firmware_version: "V1.00"            # Phiên bản firmware

# =============================================================================
# NOTE:
# - ĐỊA CHỈ IP này phải khác với STM32 (192.168.1.100) và Jetson TX2 (192.168.1.50)
# - Khi thay đổi IP, phải restart OLE driver và ping thử trước khi chạy ROS2
# - Nếu OLE dùng DHCP, đổi ip_address thành DHCP hoặc bỏ tham số này
# =============================================================================
